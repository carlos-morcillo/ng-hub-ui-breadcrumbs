<nav aria-label="breadcrumb" class="hub-breadcrumb__nav">
	<ol class="hub-breadcrumb__list">
		@for (row of rows(); track $index) {
			@if (row.item; as item) {
				<li
					class="hub-breadcrumb__item"
					[class.hub-breadcrumb__item--active]="row.isLast"
					[attr.aria-current]="row.isLast ? 'page' : null"
				>
					@if (itemTemplate(); as template) {
						<!--
							The clipping box for a custom crumb. Scoped styles never reach the elements
							a `hubBreadcrumbItem` template renders — they belong to the consuming
							component — so `truncateItems` can only clip something this component draws
							itself. It sits exactly where a built-in label sits, inside the item and
							outside the separator, so a projected crumb gets the same width as any other.
						-->
						<span class="hub-breadcrumb__custom" hubBreadcrumbLabel>
							<ng-container
								[ngTemplateOutlet]="template"
								[ngTemplateOutletContext]="{
									$implicit: item,
									isLast: row.isLast
								}"
							/>
						</span>
					} @else if (row.isLast) {
						<span class="hub-breadcrumb__text" hubBreadcrumbLabel>{{ item.label }}</span>
					} @else if (item.href) {
						<a
							class="hub-breadcrumb__link"
							hubBreadcrumbLabel
							[href]="item.href"
							[attr.target]="item.target ?? null"
							[attr.rel]="row.rel"
							[attr.download]="item.download ?? null"
						>
							{{ item.label }}
						</a>
					} @else {
						<a [routerLink]="item.url" class="hub-breadcrumb__link" hubBreadcrumbLabel>
							{{ item.label }}
						</a>
					}
				</li>
			} @else {
				<li class="hub-breadcrumb__item hub-breadcrumb__item--collapsed">
					<button
						type="button"
						class="hub-breadcrumb__collapsed"
						[attr.aria-label]="collapsedAriaLabel()"
						[attr.aria-expanded]="expanded()"
						(click)="expand()"
					>
						&hellip;
					</button>
				</li>
			}
		}
	</ol>
</nav>
